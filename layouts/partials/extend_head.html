<style>

  .my-floating-nav, .my-floating-nav a, .my-floating-nav span,
  .top-link, .top-link svg {
      transition: background-color 0.4s ease,

                  border-color 0.4s ease,

  }

  /* 浏览器最右侧滚动条的平滑过渡 */
